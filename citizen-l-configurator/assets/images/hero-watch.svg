<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Cheeto Watches inspired watch">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9f5"/>
      <stop offset="55%" style="stop-color:#f5ede6"/>
      <stop offset="100%" style="stop-color:#f0d3c1"/>
    </linearGradient>
    <linearGradient id="hc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4dcc8"/>
      <stop offset="50%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#c6a43f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset dx="0" dy="10" in="b" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#hbg)"/>
  <ellipse cx="460" cy="340" rx="200" ry="210" fill="url(#hc)" filter="url(#soft)" opacity="0.92"/>
  <ellipse cx="460" cy="340" rx="175" ry="188" fill="#fffdf9" stroke="#e8c9a8" stroke-width="2"/>
  <circle cx="460" cy="340" r="8" fill="#c6a43f"/>
  <line x1="460" y1="340" x2="460" y2="195" stroke="#2d2d2d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="460" y1="340" x2="560" y2="375" stroke="#8e8e8e" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#b8d4c8" opacity="0.35">
    <circle cx="180" cy="140" r="40"/><circle cx="760" cy="520" r="55"/>
  </g>
</svg>
